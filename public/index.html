<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SASH Nexus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash" class="splash-screen">
        <div class="splash-logo-container">
            <div class="splash-logo">SN</div>
            <div class="splash-glow"></div>
        </div>
        <div class="splash-title">SASH NEXUS</div>
        <div class="splash-subtitle">Ecosystem</div>
        <div class="splash-loader">
            <div class="loader-bar"></div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="main-app hidden">
        
        <!-- HEADER С ЛОГОТИПОМ -->
        <header class="app-header">
            <div class="header-logo">
                <div class="logo-icon">SN</div>
                <div class="logo-text">SASH NEXUS</div>
            </div>
            <div class="header-balance">
                <span class="balance-label">Баланс</span>
                <span class="balance-value">$0.00</span>
            </div>
        </header>

        <!-- ВКЛАДКИ (SPA) -->
        <div class="tabs-container">
            
            <!-- МАРКЕТ -->
            <div id="tab-market" class="tab-content active">
                <div class="tab-header">
                    <h2>Маркет</h2>
                    <p class="tab-desc">Товары из Китая</p>
                </div>
                <div class="tab-body">
                    <div class="placeholder-card">
                        <span class="placeholder-icon">🛍️</span>
                        <p>Раздел в разработке</p>
                    </div>
                </div>
            </div>

            <!-- ЛОГИСТИКА -->
            <div id="tab-logistics" class="tab-content">
                <div class="tab-header">
                    <h2>Логистика</h2>
                    <p class="tab-desc">Трекинг грузов</p>
                </div>
                <div class="tab-body">
                    <div class="placeholder-card">
                        <span class="placeholder-icon">📦</span>
                        <p>Раздел в разработке</p>
                    </div>
                </div>
            </div>

            <!-- КРИПТА -->
            <div id="tab-crypto" class="tab-content">
                <div class="tab-header">
                    <h2>Крипта</h2>
                    <p class="tab-desc">Обмен и кошелёк</p>
                </div>
                <div class="tab-body">
                    <div class="placeholder-card">
                        <span class="placeholder-icon">💎</span>
                        <p>Раздел в разработке</p>
                    </div>
                </div>
            </div>

            <!-- ТУРИЗМ -->
            <div id="tab-tourism" class="tab-content">
                <div class="tab-header">
                    <h2>Туризм</h2>
                    <p class="tab-desc">Туры и путешествия</p>
                </div>
                <div class="tab-body">
                    <div class="placeholder-card">
                        <span class="placeholder-icon">✈️</span>
                        <p>Раздел в разработке</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="tab-market">
                <span class="nav-icon">🛍️</span>
                <span class="nav-label">Маркет</span>
            </button>
            <button class="nav-btn" data-tab="tab-logistics">
                <span class="nav-icon">📦</span>
                <span class="nav-label">Логистика</span>
            </button>
            <button class="nav-btn" data-tab="tab-crypto">
                <span class="nav-icon">💎</span>
                <span class="nav-label">Крипта</span>
            </button>
            <button class="nav-btn" data-tab="tab-tourism">
                <span class="nav-icon">✈️</span>
                <span class="nav-label">Туризм</span>
            </button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
