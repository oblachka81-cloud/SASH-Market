<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SASH Nexus</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем официальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        
        <!-- СТРАНИЦЫ -->
        <div id="page-market" class="page active">
            <h1>🇨🇳 Маркет</h1>
            <p class="subtitle">Товары из Китая</p>
            <div class="card">Здесь скоро появятся товары с 1688 и Taobao</div>
        </div>

        <div id="page-logistics" class="page">
            <h1> Логистика</h1>
            <p class="subtitle">Трекинг грузов</p>
            <div class="card">Введите трек-номер для отслеживания</div>
        </div>

        <div id="page-crypto" class="page">
            <h1>💎 Крипта</h1>
            <p class="subtitle">Обмен и кошелек</p>
            <div class="card">Баланс: 0 USDT</div>
        </div>

        <div id="page-tourism" class="page">
            <h1>✈️ Туризм</h1>
            <p class="subtitle">Туры и отели</p>
            <div class="card">Лучшие направления этого сезона</div>
        </div>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-target="page-market">
                <span class="icon">🛍️</span>
                <span class="label">Маркет</span>
            </button>
            <button class="nav-btn" data-target="page-logistics">
                <span class="icon"></span>
                <span class="label">Логистика</span>
            </button>
            <button class="nav-btn" data-target="page-crypto">
                <span class="icon">💎</span>
                <span class="label">Крипта</span>
            </button>
            <button class="nav-btn" data-target="page-tourism">
                <span class="icon">✈️</span>
                <span class="label">Туризм</span>
            </button>
        </nav>

    </div>
    <script src="app.js"></script>
</body>
</html>
